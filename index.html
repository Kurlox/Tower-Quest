<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#0d0b1a" />
  <title>Tower Quest : Curiosity</title>
  <meta name="description" content="Tower Quest : Curiosity — plateformer 2D pixel art à labyrinthes procéduraux, jouable sur PC et mobile." />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><rect width='16' height='16' fill='%230d0b1a'/><rect x='5' y='2' width='6' height='12' fill='%237c5cff'/><rect x='6' y='4' width='4' height='3' fill='%2337e0c8'/></svg>" />
  <link rel="manifest" href="manifest.webmanifest" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div id="game-root">
    <canvas id="game"></canvas>

    <!-- HUD -->
    <div id="hud">
      <div id="hud-left">
        <span id="floor-label">Étage —</span>
        <span id="time-label">0:00</span>
        <span id="deaths-label">☠ 0</span>
      </div>
      <div id="hud-right">
        <button id="btn-sound" class="hud-btn" title="Son">🔊</button>
        <button id="btn-menu" class="hud-btn" title="Menu">☰</button>
      </div>
    </div>

    <!-- Message flottant (hint / dead-end / etc.) -->
    <div id="toast"></div>

    <!-- Overlays -->
    <div id="overlay" class="overlay">
      <div class="overlay-card" id="overlay-card">
        <!-- rempli par JS -->
      </div>
    </div>
  </div>

  <script src="js/utils.js"></script>
  <script src="js/input.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/maze.js"></script>
  <script src="js/particles.js"></script>
  <script src="js/renderer.js"></script>
  <script src="js/player.js"></script>
  <script src="js/game.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
